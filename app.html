<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takt — Workspace</title>
<link rel="icon" href="assets/img/mark.svg">
<link rel="stylesheet" href="assets/css/takt.css">
</head>
<body class="app-body">
<div class="app">
  <header class="topbar">
    <a class="brand" href="index.html"><img class="brand-mark" src="assets/img/mark.svg" alt="">TAKT</a>
    <div class="crumb" id="crumb"></div>
    <div class="spacer"></div>
    <div class="runstat" id="runstat" hidden><span id="runLabel"></span><div class="progress"><i id="runBar"></i></div><button class="btn sm ghost" id="runCancel">취소</button></div>
    <button class="btn ghost sm" id="themeBtn" title="테마 전환"></button>
  </header>

  <nav class="nav" id="nav">
    <div class="label">워크스페이스</div>
    <a data-view="cases"></a>
    <a data-view="free"></a>
    <div class="label" style="margin-top:12px">분석</div>
    <a data-view="line"></a>
    <a data-view="cond"></a>
    <a data-view="robot"></a>
    <a data-view="decide"></a>
    <a data-view="ops"></a>
    <a data-view="exp"></a>
    <a data-view="report"></a>
    <div class="label" style="margin-top:12px">신뢰성</div>
    <a data-view="valid"></a>
    <div class="foot" id="navFoot"></div>
  </nav>

  <main class="main" id="main">
    <section class="view" id="v-cases"></section>
    <section class="view" id="v-editor"></section>
    <section class="view" id="v-line"></section>
    <section class="view" id="v-robot"></section>
    <section class="view" id="v-exp"></section>
    <section class="view" id="v-report"></section>
    <section class="view" id="v-free"></section>
    <section class="view" id="v-cond"></section>
    <section class="view" id="v-ops"></section>
    <section class="view" id="v-valid"></section>
    <section class="view" id="v-decide"></section>
  </main>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="pkgIn" accept=".json,application/json" hidden>
<input type="file" id="mesIn" accept=".csv,.txt,text/csv" hidden>
<input type="file" id="formIn" accept=".csv,.txt,.json,text/csv" hidden>
<div class="toast" id="toast"></div>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
